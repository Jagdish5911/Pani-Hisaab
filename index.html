<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pani Hisaab</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7fb;--card:#fff;--tx:#14202e;--mut:#667689;--bd:#dde5ee;--blue:#1769d6;--green:#1f9d55;--red:#d64545;--amber:#c27a00}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--card:#18222e;--tx:#e8eef5;--mut:#92a3b6;--bd:#2a3846;--blue:#4a96f5;--green:#35c070;--red:#f07070;--amber:#e8a73a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1620;--card:#18222e;--tx:#e8eef5;--mut:#92a3b6;--bd:#2a3846;--blue:#4a96f5;--green:#35c070;--red:#f07070;--amber:#e8a73a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{font-size:12px;color:var(--mut);display:block;margin:8px 0 4px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{padding:8px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
button{font:inherit;cursor:pointer}
.big{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:600}
.amt{font-size:22px;font-weight:700;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--mut)}
.tm{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue)}
.ring{border-color:var(--red);animation:bl 1s infinite}
@keyframes bl{50%{background:rgba(214,69,69,.15)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-weight:600}.sub{font-size:12px;color:var(--mut)}
.badge{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:600}
.p{background:rgba(194,122,0,.15);color:var(--amber)}.g{background:rgba(31,157,85,.15);color:var(--green)}
.done{padding:10px 16px;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:600}
.stop{padding:10px 16px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:600}
.pz{padding:10px 16px;border:0;border-radius:10px;background:var(--amber);color:#fff;font-weight:600}
.rs{padding:10px 16px;border:1px solid var(--mut);border-radius:10px;background:none;color:var(--tx);font-weight:600}
.del{background:none;border:1px solid var(--red);color:var(--red);border-radius:10px;font-weight:600;font-size:14px;padding:9px 14px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.empty{text-align:center;color:var(--mut);padding:16px;font-size:14px}
</style>
</head>
<body>
<h1>💧 Pani Hisaab</h1>

<div class="card">
  <div class="row">
    <div><label>Naam</label><input id="nm" placeholder="Customer ka naam"></div>
    <div><label>Rate ₹ / ghanta</label><input id="rate" type="number" inputmode="numeric" value="300"></div>
  </div>
  <label>Kitni der (minute)</label>
  <input id="min" type="number" inputmode="numeric" value="60">
  <div class="chips" id="chips"></div>
  <div class="amt">Charge: ₹<span id="amt">300</span></div>
  <button class="big" id="start">▶ Pani Chalu + Alarm Lagao</button>
</div>

<div id="active"></div><div id="resetAll"></div>

<div class="stats">
  <div class="stat"><b id="sT">₹0</b><span>Total</span></div>
  <div class="stat"><b id="sG" style="color:var(--green)">₹0</b><span>Mil gaye</span></div>
  <div class="stat"><b id="sP" style="color:var(--amber)">₹0</b><span>Baaki</span></div>
</div>

<div class="tabs" id="tabs"></div>
<div id="list"></div>

<script>
var KEY="pani_hisaab_v1",S={entries:[],rate:300},filter="all",ringId=null,actx=null,beepT=null,dur=60;
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
$("rate").value=S.rate||300;

function calc(){var m=+$("min").value||0,r=+$("rate").value||0;$("amt").textContent=Math.round(r*m/60);}
[30,60,90,120].forEach(function(m){var b=document.createElement("button");b.className="chip";b.textContent=m<60?m+" min":(m/60)+" ghanta";b.onclick=function(){$("min").value=m;chipsOn();calc()};b.dataset.m=m;$("chips").appendChild(b)});
function chipsOn(){[].forEach.call($("chips").children,function(c){c.classList.toggle("on",+c.dataset.m==+$("min").value)})}
$("min").oninput=function(){chipsOn();calc()};
$("rate").oninput=function(){S.rate=+$("rate").value;save();calc()};
chipsOn();calc();

function money(n){return "₹"+Math.round(n)}
function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}
function dt(t){var d=new Date(t);return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})+", "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}

function beep(){try{if(!actx)return;var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.4,actx.currentTime);o.start();o.stop(actx.currentTime+.35)}catch(e){}if(navigator.vibrate)navigator.vibrate([300,150,300])}
function startRing(id){if(ringId)return;ringId=id;beep();beepT=setInterval(beep,1000);try{if("Notification" in window&&Notification.permission==="granted")new Notification("Pani ka time khatam!",{body:"Pani band karo"})}catch(e){}}
function stopRing(id){clearInterval(beepT);ringId=null;var e=S.entries.find(function(x){return x.id==id});if(e){e.alarmDone=true;save()}render()}
window.stopRing=stopRing;

$("start").onclick=function(){
  var m=+$("min").value,name=$("nm").value.trim();
  if(!m||m<=0){alert("Minute daalo");return}
  if(!name)name="Customer";
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}
  var now=Date.now();
  S.entries.unshift({id:now,name:name,minutes:m,amount:+$("amt").textContent,start:now,end:now+m*60000,total:m*60000,rate:+$("rate").value||300,paused:false,remaining:0,stopped:false,paid:false,paidAt:null,alarmDone:false});
  save();$("nm").value="";render();
};
window.pay=function(id){var e=S.entries.find(function(x){return x.id==id});if(e){e.paid=true;e.paidAt=Date.now();save();render()}};
var armed={};
function twice(k){if(armed[k]){delete armed[k];return true}armed[k]=1;setTimeout(function(){delete armed[k];render()},3000);render();return false}
function live(e){return !e.alarmDone&&(e.paused||e.end>Date.now())}
window.del=function(id){if(!twice("d"+id))return;S.entries=S.entries.filter(function(x){return x.id!=id});save();render()};
window.resetT=function(id){if(!twice("r"+id))return;S.entries=S.entries.filter(function(x){return x.id!=id||!live(x)});save();render()};
window.resetAll=function(){if(!twice("all"))return;S.entries=S.entries.filter(function(x){return !live(x)});save();render()};
window.setF=function(f){filter=f;render()};
window.pauseR=function(id){var e=S.entries.find(function(x){return x.id==id});if(!e)return;if(e.paused){e.end=Date.now()+e.remaining;e.paused=false}else{e.remaining=Math.max(0,e.end-Date.now());e.paused=true}save();render()};
window.stopW=function(id){var e=S.entries.find(function(x){return x.id==id});if(!e)return;if(!twice("s"+id))return;var rem=e.paused?e.remaining:Math.max(0,e.end-Date.now());var tot=e.total||e.minutes*60000;var el=tot-rem;e.minutes=Math.round(el/6000)/10;e.amount=Math.round((e.rate||S.rate||300)*e.minutes/60);e.stopped=true;e.paused=false;e.alarmDone=true;save();render()};

function render(){
  var now=Date.now(),act=S.entries.filter(function(e){return !e.alarmDone});
  $("active").innerHTML=act.map(function(e){var left=e.paused?e.remaining:e.end-now,ring=!e.paused&&left<=0;
    return '<div class="card'+(ring?' ring':'')+'"><div class="top"><div><div class="nm">'+esc(e.name)+'</div><div class="sub">'+e.minutes+' min • '+money(e.amount)+(e.paused?' • ⏸ Ruka hua':'')+'</div></div>'+
    (ring?'<button class="stop" onclick="stopRing('+e.id+')">⏹ Alarm band</button>':'<div class="tm" data-end="'+(e.paused?'':e.end)+'">'+fmt(left)+'</div>')+'</div>'+(ring?'':'<div class="top" style="margin-top:10px;flex-wrap:wrap;justify-content:flex-start"><button class="pz" onclick="pauseR('+e.id+')">'+(e.paused?'▶ Chalu karo':'⏸ Pause')+'</button><button class="stop" onclick="stopW('+e.id+')">'+(armed["s"+e.id]?"Pakka? Dobara dabao":"⏹ Pani Band")+'</button><button class="rs" onclick="resetT('+e.id+')">'+(armed["r"+e.id]?"Pakka? Dobara dabao":"↺ Reset")+'</button></div>')+'</div>'}).join("");
  var T=0,G=0;S.entries.forEach(function(e){T+=e.amount;if(e.paid)G+=e.amount});
  $("resetAll").innerHTML=act.some(live)?'<button class="rs" style="width:100%;margin-bottom:12px" onclick="resetAll()">'+(armed.all?"Pakka? Dobara dabao":"↺ Reset sab timer (0)")+'</button>':"";$("sT").textContent=money(T);$("sG").textContent=money(G);$("sP").textContent=money(T-G);
  $("tabs").innerHTML=[["all","Sab"],["pending","Pending"],["given","Given"]].map(function(t){return '<button class="chip'+(filter==t[0]?' on':'')+'" onclick="setF(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
  var L=S.entries.filter(function(e){return filter=="all"||(filter=="pending"?!e.paid:e.paid)});
  $("list").innerHTML=L.length?L.map(function(e){
    return '<div class="card"><div class="top"><div><div class="nm">'+esc(e.name)+' <span class="badge '+(e.paid?'g':'p')+'">'+(e.paid?'Given':'Pending')+'</span></div>'+
    '<div class="sub">'+dt(e.start)+' • '+e.minutes+' min'+(e.stopped?' (beech mein roka)':'')+'</div>'+(e.paid?'<div class="sub">Paise mile: '+dt(e.paidAt)+'</div>':'')+'</div>'+
    '<div style="text-align:right"><div class="nm">'+money(e.amount)+'</div></div></div>'+
    '<div class="top" style="margin-top:10px">'+(e.paid?'<span></span>':'<button class="done" onclick="pay('+e.id+')">✔ Done (paise mil gaye)</button>')+'<button class="del" onclick="del('+e.id+')">'+(armed["d"+e.id]?"Pakka? Dobara dabao":"🗑 Delete")+'</button></div></div>'}).join(""):'<div class="empty">Abhi koi entry nahi</div>';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

setInterval(function(){
  var now=Date.now(),need=false;
  S.entries.forEach(function(e){if(!e.alarmDone&&!e.paused&&e.end<=now){startRing(e.id);need=true}});
  document.querySelectorAll(".tm").forEach(function(el){if(!el.dataset.end)return;var l=+el.dataset.end-now;el.textContent=fmt(l);if(l<=0)need=true});
  if(need)render();
},500);
render();
</script>
</body>
</html>
